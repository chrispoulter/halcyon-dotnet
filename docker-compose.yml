services:
  halcyon-dotnet-web:
    image: halcyon-dotnet-web:latest
    build:
      context: ./Halcyon.Web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: https://localhost:7257
      # VITE_RUNTIME_VALUE_1: DOCKER_RUNTIME_VALUE_1
      # VITE_RUNTIME_VALUE_2: DOCKER_RUNTIME_VALUE_2
    ports:
      - 5173:80

  halcyon-dotnet-api:
    image: halcyon-dotnet-api:latest
    build:
      context: .
      dockerfile: ./Halcyon.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081;http://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=halcyon_dotnet;Username=postgres;Password=password
      ConnectionStrings__Mail: Endpoint=smtp://host.docker.internal:1025
      Email__SiteUrl: http://localhost:5173
      Email__NoReplyAddress: noreply@example.com
      Jwt__SecurityKey: super_secret_key_that_should_be_changed
      Seed__Users__0__EmailAddress: system.administrator@example.com
      Seed__Users__0__Password: super_secret_password_that_should_be_changed
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Error
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      # OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=super_secret_otlp_api_key_that_should_be_changed
      
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-otel-lgtm:4317

      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq:5341/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

      OTEL_SERVICE_NAME: halcyon-dotnet-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker
    ports:
      - 5257:8080
      - 7257:8081
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  postgres:
    image: postgres:18.3
    user: postgres
    environment:
      POSTGRES_DB: halcyon_dotnet
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.22.3
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailpit_data:/data
    restart: always

  # aspire-dashboard:
  #   image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
  #   environment:
  #     DASHBOARD__FRONTEND__AUTHMODE: Unsecured
  #     DASHBOARD__OTLP__AUTHMODE: Unsecured
  #     # DASHBOARD__FRONTEND__AUTHMODE: BrowserToken
  #     # DASHBOARD__FRONTEND__BROWSERTOKEN: super_secret_dashboard_token_that_should_be_changed
  #     # DASHBOARD__OTLP__AUTHMODE: ApiKey
  #     # DASHBOARD__OTLP__PRIMARYAPIKEY: super_secret_otlp_api_key_that_should_be_changed
  #   ports:
  #     - 18888:18888 
  #     - 4317:18889 
  #     - 4318:18890
  #   restart: always

  # grafana-otel-lgtm:
  #   image: grafana/otel-lgtm:latest
  #   ports:
  #     - 3000:3000
  #     - 4317:4317
  #     - 4318:4318
  #   volumes:
  #     - grafana_lgtm_data:/data
  #   restart: always

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - 8080:80
      - 5341:5341
    volumes:
      - seq_data:/data
    restart: always

volumes:
  postgres_data:
  mailpit_data:
  # grafana_lgtm_data:
  seq_data:
